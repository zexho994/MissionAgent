<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1500" viewBox="0 0 2600 1500">
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .screen { fill: #ffffff; stroke: #20242a; stroke-width: 3; }
      .panel { fill: #ffffff; stroke: #2d333b; stroke-width: 2.4; }
      .soft { fill: #f2f4f7; stroke: #c7ced8; stroke-width: 1.6; }
      .line { stroke: #d5dbe3; stroke-width: 2; }
      .strong { fill: #15181d; font: 700 26px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { fill: #15181d; font: 700 34px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .text { fill: #252a31; font: 500 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .small { fill: #5b6472; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .muted { fill: #727b89; font: 500 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .chip { fill: #eef4ff; stroke: #b8ccf5; stroke-width: 1.4; }
      .green { fill: #e9f8ef; stroke: #98d8ad; stroke-width: 1.4; }
      .amber { fill: #fff6df; stroke: #e4c36a; stroke-width: 1.4; }
      .blue { fill: #edf4ff; stroke: #9ebcef; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="bg" width="2600" height="1500"/>

  <text x="70" y="70" class="title">DigitalAgent UI Wireframes</text>
  <text x="70" y="110" class="small">根据原型图整理：主页面以 Owner 对话生成 Mission；Mission 详情页以作战室看板观察团队运行。</text>

  <!-- Main page -->
  <text x="70" y="180" class="strong">主页面：Owner 对话入口</text>
  <rect x="70" y="215" width="1180" height="1120" rx="26" class="screen"/>
  <line x1="70" y1="315" x2="1250" y2="315" class="line"/>
  <text x="110" y="277" class="strong">DigitalAgent</text>
  <rect x="885" y="245" width="150" height="46" rx="12" class="panel"/>
  <text x="916" y="276" class="text">Mission</text>
  <circle cx="1075" cy="267" r="7" fill="#16a34a"/>
  <text x="1092" y="275" class="text">OpenClaw 已连接</text>

  <rect x="690" y="375" width="420" height="84" rx="18" class="soft"/>
  <text x="725" y="425" class="text">用户：我想做一个自动运营任务</text>
  <rect x="190" y="520" width="420" height="96" rx="18" class="panel"/>
  <text x="225" y="574" class="text">Owner：我先补齐 Mission 定义</text>
  <text x="205" y="665" class="text">Owner 思考节点 1：目标是否可衡量</text>
  <text x="205" y="705" class="text">Owner 思考节点 2：需要哪些角色</text>
  <text x="205" y="745" class="text">Owner 思考节点 3：哪些动作要确认</text>
  <rect x="690" y="830" width="420" height="84" rx="18" class="soft"/>
  <text x="725" y="880" class="text">用户：选择目标、渠道和限制条件</text>

  <rect x="170" y="990" width="900" height="150" rx="20" class="panel"/>
  <text x="215" y="1048" class="text">用户确认表单区域</text>
  <rect x="215" y="1078" width="122" height="36" rx="18" class="chip"/>
  <text x="240" y="1102" class="small">目标</text>
  <rect x="355" y="1078" width="122" height="36" rx="18" class="chip"/>
  <text x="381" y="1102" class="small">受众</text>
  <rect x="495" y="1078" width="150" height="36" rx="18" class="chip"/>
  <text x="521" y="1102" class="small">执行边界</text>
  <rect x="670" y="1078" width="180" height="36" rx="18" class="chip"/>
  <text x="696" y="1102" class="small">确认后生成</text>

  <rect x="170" y="1185" width="900" height="110" rx="20" class="panel"/>
  <text x="215" y="1248" class="muted">继续输入：补充背景、纠正 Owner 理解、或直接确认 Mission</text>
  <rect x="930" y="1220" width="92" height="44" rx="12" fill="#15181d"/>
  <text x="956" y="1249" fill="#ffffff" style="font:700 18px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;">发送</text>

  <!-- Detail page -->
  <text x="1370" y="180" class="strong">Mission 详情页：作战室 Dashboard</text>
  <rect x="1370" y="215" width="1160" height="1120" rx="26" class="screen"/>
  <line x1="1370" y1="315" x2="2530" y2="315" class="line"/>
  <text x="1410" y="277" class="strong">Mission / 学习 Harness</text>
  <rect x="2165" y="245" width="150" height="46" rx="12" class="panel"/>
  <text x="2196" y="276" class="text">Mission</text>
  <circle cx="2355" cy="267" r="7" fill="#16a34a"/>
  <text x="2372" y="275" class="text">OpenClaw 已连接</text>

  <line x1="1530" y1="315" x2="1530" y2="1335" class="line"/>
  <rect x="1400" y="390" width="105" height="58" rx="12" class="panel"/>
  <text x="1417" y="426" class="small">总控看板</text>
  <rect x="1400" y="510" width="105" height="58" rx="12" class="soft"/>
  <text x="1416" y="546" class="small">Agents</text>
  <rect x="1400" y="630" width="105" height="58" rx="12" class="soft"/>
  <text x="1418" y="666" class="small">任务列表</text>
  <rect x="1400" y="750" width="105" height="58" rx="12" class="soft"/>
  <text x="1418" y="786" class="small">定时任务</text>
  <rect x="1400" y="870" width="105" height="58" rx="12" class="soft"/>
  <text x="1418" y="906" class="small">产出列表</text>

  <text x="1575" y="380" class="strong">总控看板</text>
  <text x="1575" y="420" class="small">默认展示团队如何协作、任务进度、阶段状态和核心产出。</text>

  <rect x="1575" y="460" width="235" height="112" rx="16" class="green"/>
  <text x="1600" y="500" class="text">Owner</text>
  <text x="1600" y="535" class="small">正在澄清 Mission</text>
  <rect x="1835" y="460" width="235" height="112" rx="16" class="blue"/>
  <text x="1860" y="500" class="text">Planner</text>
  <text x="1860" y="535" class="small">等待确认后拆任务</text>
  <rect x="2095" y="460" width="235" height="112" rx="16" class="amber"/>
  <text x="2120" y="500" class="text">Worker</text>
  <text x="2120" y="535" class="small">等待任务分配</text>

  <rect x="1575" y="630" width="360" height="250" rx="18" class="panel"/>
  <text x="1605" y="675" class="text">协作流</text>
  <circle cx="1630" cy="730" r="14" fill="#15181d"/>
  <line x1="1660" y1="730" x2="1870" y2="730" stroke="#9aa3af" stroke-width="2"/>
  <circle cx="1900" cy="730" r="14" fill="#64748b"/>
  <line x1="1930" y1="730" x2="2140" y2="730" stroke="#9aa3af" stroke-width="2"/>
  <circle cx="2170" cy="730" r="14" fill="#64748b"/>
  <text x="1605" y="785" class="small">Owner 先确认边界，HR 再创建团队，Planner 才开始拆任务。</text>
  <text x="1605" y="825" class="small">这里展示 agent 之间的关键讨论，而不是所有日志。</text>

  <rect x="1970" y="630" width="500" height="250" rx="18" class="panel"/>
  <text x="2000" y="675" class="text">代表任务</text>
  <rect x="2000" y="710" width="430" height="42" rx="10" class="soft"/>
  <text x="2020" y="737" class="small">定义成功标准</text>
  <rect x="2000" y="765" width="430" height="42" rx="10" class="soft"/>
  <text x="2020" y="792" class="small">确认浏览器 / OpenClaw 权限</text>
  <rect x="2000" y="820" width="430" height="42" rx="10" class="soft"/>
  <text x="2020" y="847" class="small">生成第一版执行计划</text>

  <rect x="1575" y="930" width="895" height="245" rx="18" class="panel"/>
  <text x="1605" y="975" class="text">产出时间线</text>
  <line x1="1640" y1="1035" x2="2400" y2="1035" stroke="#c0c7d2" stroke-width="3"/>
  <circle cx="1680" cy="1035" r="12" fill="#15181d"/>
  <text x="1645" y="1080" class="small">Mission Brief</text>
  <circle cx="1900" cy="1035" r="12" fill="#64748b"/>
  <text x="1860" y="1080" class="small">Team Plan</text>
  <circle cx="2120" cy="1035" r="12" fill="#64748b"/>
  <text x="2075" y="1080" class="small">Execution</text>
  <circle cx="2340" cy="1035" r="12" fill="#64748b"/>
  <text x="2305" y="1080" class="small">Review</text>

  <rect x="1575" y="1215" width="895" height="76" rx="16" class="soft"/>
  <text x="1605" y="1262" class="small">设计原则：主页面负责“生成 Mission”，详情页负责“观察团队运行”。不要把所有状态堆在主页面。</text>
</svg>
