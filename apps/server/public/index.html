<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DigitalAgent Mission Harness</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-root">
      <header class="topbar">
        <button id="home-button" class="brand-button" type="button" aria-label="返回主页面">
          <span>DigitalAgent</span>
          <strong>Mission Harness</strong>
        </button>
        <div class="topbar-actions">
          <button id="new-chat-button" class="new-chat-button" type="button">新对话</button>
          <div class="mission-menu">
            <button id="mission-button" class="mission-button" type="button" aria-expanded="false">Mission</button>
            <div id="mission-popover" class="mission-popover" hidden></div>
          </div>
          <div class="status-pill">
            <span id="openclaw-dot" class="dot"></span>
            <span id="openclaw-status">检测中...</span>
          </div>
          <button id="refresh" class="icon-button" type="button" aria-label="刷新">刷新</button>
        </div>
      </header>

      <section id="app-view" class="app-view"></section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
